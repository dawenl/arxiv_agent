[project]
name = "arxiv-agent"
version = "0.1.0"
description = "An intelligent arxiv paper filtering agent based on your research interests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dawen Liang (with a lot of help from Claude 4.5 Opus)" }]
keywords = [
    "arxiv",
    "research",
    "papers",
    "ai",
    "embeddings",
    "semantic-search",
]

dependencies = [
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.2",
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
arxiv-agent = "arxiv_agent.main:main"

[project.urls]
Homepage = "https://github.com/dawenl/arxiv_agent"
Repository = "https://github.com/dawenl/arxiv_agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_agent"]
